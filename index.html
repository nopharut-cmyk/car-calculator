<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Multi-Brand Car Finance & Quotation Pro (Cloudflare D1 + AI)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'sans-serif'] },
          colors: {
            slate: { 850: '#182030', 900: '#0f172a', 950: '#080c14' },
            brand: { DEFAULT: '#2563eb', 600: '#1d4ed8', 700: '#1e40af' }
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; color: #1e293b; }
    @media print { .no-print { display: none !important; } body { background: white !important; } }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    const AVAILABLE_MONTHS = [24, 36, 48, 60, 72, 84, 96];
    const BRANDS = [
      { id: 'toyota', name: 'TOYOTA', img: 'https://img1.pic.in.th/images/Toyota.png' },
      { id: 'honda', name: 'HONDA', img: 'https://img2.pic.in.th/Honda.png' },
      { id: 'isuzu', name: 'ISUZU', img: 'https://img1.pic.in.th/images/Isuzu.png' },
      { id: 'nissan', name: 'NISSAN', img: 'https://img2.pic.in.th/Nissan.png' },
      { id: 'mitsubishi', name: 'MITSUBISHI', img: 'https://img2.pic.in.th/Mitsubishi.png' },
      { id: 'ford', name: 'FORD', img: 'https://img1.pic.in.th/images/Ford.png' },
      { id: 'mazda', name: 'MAZDA', img: 'https://img2.pic.in.th/Mazda.png' },
      { id: 'suzuki', name: 'SUZUKI', img: 'https://img2.pic.in.th/Suzuki.png' },
      { id: 'kia', name: 'KIA', img: 'https://img2.pic.in.th/Kia.png' },
      { id: 'byd', name: 'BYD', img: 'https://img2.pic.in.th/BYD.png' },
      { id: 'omoda_jaecoo', name: 'OMODA & JAECOO', img: 'https://img2.pic.in.th/OJ.png' },
      { id: 'mg', name: 'MG', img: 'https://img2.pic.in.th/MG.png' },
      { id: 'gac_aion', name: 'GAC AION', img: 'https://img2.pic.in.th/Aion.png' },
      { id: 'geely', name: 'GEELY', img: 'https://img2.pic.in.th/Geely.png' },
      { id: 'Changan', name: 'CHANGAN', img: 'https://img1.pic.in.th/images/Changan.png' },
      { id: 'gwm', name: 'GWM', img: 'https://img2.pic.in.th/GWM.png' },
      { id: 'chery', name: 'CHERY', img: 'https://img1.pic.in.th/images/Chery.png' },
      { id: 'icar', name: 'iCAR', img: 'https://img1.pic.in.th/images/iCAR.png' },
      { id: 'lepas', name: 'LEPAS', img: 'https://img2.pic.in.th/Lepas.png' },
      { id: 'Tesla', name: 'TESLA', img: 'https://img1.pic.in.th/images/Tesla.png' }
    ];

    let state = {
      step: 'brand',
      selectedBrand: null,
      company: { name: 'บริษัท เมกา ออโตโมบิล ติวานนท์ จำกัด', address: '59/3 หมู่ 4 ตำบลบ้านใหม่ อำเภอเมืองปทุมธานี จังหวัดปทุมธานี 12000' },
      cars: [],
      campaigns: [],
      editingCarId: null,
      editingCampaignIndex: null,
      // 4 แผนคำนวณการผ่อน
      plans: [
        { id: 1, name: 'แผนที่ 1', isOpen: true, term: 48, campaignIdx: 0, downPct: 25, downAmt: 0, customRate: '' },
        { id: 2, name: 'แผนที่ 2', isOpen: false, term: 60, campaignIdx: 0, downPct: 25, downAmt: 0, customRate: '' },
        { id: 3, name: 'แผนที่ 3', isOpen: false, term: 72, campaignIdx: 0, downPct: 25, downAmt: 0, customRate: '' },
        { id: 4, name: 'แผนที่ 4', isOpen: false, term: 84, campaignIdx: 0, downPct: 25, downAmt: 0, customRate: '' }
      ]
    };

    const fmt = n => (Number(n) || 0).toLocaleString('th-TH');
    const num = s => { const p = parseFloat(String(s).replace(/[^0-9.]/g, '')); return isNaN(p) ? 0 : p; };

    async function loadDataFromCloud() {
      try {
        const [carsRes, campRes] = await Promise.all([
          fetch(`/api/cars?brand=${state.selectedBrand}`),
          fetch('/api/campaigns')
        ]);
        if (!carsRes.ok || !campRes.ok) throw new Error('API response failed');
        state.cars = await carsRes.json();
        state.campaigns = await campRes.json();
      } catch (err) {
        console.warn("⚠️ ใช้ Mock Data สำรอง:", err);
        if (!state.cars || state.cars.length === 0) {
          state.cars = [
            { id: 101, brand: state.selectedBrand, model: 'URBAN', grade: 'MAX', price: 649900, colors: [{ name: 'สีมาตรฐาน', price: 0 }, { name: 'สีขาวมุก', price: 7000 }] },
            { id: 102, brand: state.selectedBrand, model: 'URBAN', grade: 'PRO', price: 729900, colors: [{ name: 'สีมาตรฐาน', price: 0 }, { name: 'LAVENDER PURPLE', price: 10000 }] }
          ];
        }
        if (!state.campaigns || state.campaigns.length === 0) {
          state.campaigns = [
            {
              finance: 'กรุงศรี ออโต้',
              name: 'URBAN',
              rates: {
                30: { 24: 1.89, 36: 1.99, 48: 2.09, 60: 2.45, 72: 2.75, 84: 3.40, 96: null },
                25: { 24: 1.99, 36: 2.09, 48: 2.19, 60: 2.45, 72: 2.75, 84: 3.40, 96: null },
                20: { 24: 2.09, 36: 2.19, 48: 2.45, 60: 2.65, 72: 3.10, 84: 3.65, 96: null },
                15: { 24: 2.19, 36: 2.29, 48: 2.95, 60: 3.20, 72: 3.50, 84: 4.25, 96: null },
                10: { 24: 2.29, 36: 2.39, 48: 3.49, 60: 3.89, 72: 4.09, 84: 4.79, 96: null },
                5:  { 24: 2.39, 36: 2.49, 48: 3.89, 60: 4.35, 72: 4.59, 84: 5.15, 96: null }
              }
            }
          ];
        }
      } finally {
        render();
      }
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '';
      if (state.step === 'brand') app.innerHTML = renderBrandSelector();
      else if (state.step === 'calc') {
        app.innerHTML = renderCalculator();
        setTimeout(initCalcValues, 50);
      }
      else if (state.step === 'settings') app.innerHTML = renderSettings();
    }

    function renderBrandSelector() {
      return `
        <div class="min-h-screen flex flex-col justify-center items-center p-6 bg-gradient-to-br from-slate-900 to-slate-950 text-white">
          <div class="max-w-4xl w-full text-center mb-10">
            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30">CLOUD-DATABASE PRO (D1) + AI VISION</span>
            <h1 class="text-3xl sm:text-4xl font-bold mt-3">เลือกแบรนด์รถยนต์ที่ต้องการคำนวณ</h1>
          </div>
          <div class="max-w-4xl w-full grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            ${BRANDS.map(b => `
              <button onclick="selectBrand('${b.id}')" class="group flex flex-col items-center justify-center p-5 rounded-2xl bg-slate-800/60 border border-slate-700 hover:border-blue-500 transition-all shadow-lg">
                <div class="w-12 h-12 mb-3 flex items-center justify-center bg-white/10 rounded-xl p-2">
                  <img src="${b.img}" alt="${b.name}" class="max-h-full max-w-full object-contain">
                </div>
                <span class="font-semibold text-xs text-slate-200 text-center">${b.name}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCalculator() {
      const brandObj = BRANDS.find(b => b.id === state.selectedBrand) || { name: 'CAR', img: '' };
      const uniqueModels = [...new Set(state.cars.map(c => c.model))];
      const currentModel = document.getElementById('modelSelect') ? document.getElementById('modelSelect').value : (uniqueModels[0] || '');
      const gradesForModel = state.cars.filter(c => c.model === currentModel);

      // กรองแคมเปญตามรุ่นรถปัจจุบัน (ถ้าชื่อแคมเปญตรงกับรุ่นรถ หรือแสดงทั้งหมดถ้าไม่ตรง)
      const matchingCampaigns = state.campaigns.filter(cp => cp.name.toUpperCase() === currentModel.toUpperCase());
      const availableCampaigns = matchingCampaigns.length > 0 ? matchingCampaigns : state.campaigns;

      return `
        <div class="min-h-screen flex flex-col">
          <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center sticky top-0 z-30">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 bg-white/10 rounded-xl p-1.5 flex items-center justify-center">
                <img src="${brandObj.img}" class="max-h-full max-w-full object-contain">
              </div>
              <div>
                <h1 class="font-bold text-base">${brandObj.name} FINANCE CALCULATOR</h1>
                <p class="text-xs text-slate-400">${state.company.name}</p>
              </div>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="state.step='settings';render()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold">⚙️ ตั้งค่ารุ่นรถ/ดอกเบี้ย</button>
              <button onclick="state.step='brand';render()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold">เปลี่ยนแบรนด์</button>
            </div>
          </header>

          <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
              
              <!-- ข้อมูลรถยนต์ -->
              <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-800 mb-4">🚗 ข้อมูลรถยนต์</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ชื่อรุ่นรถ (Model)</label>
                    <select id="modelSelect" onchange="onModelChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                      ${uniqueModels.map(m => `<option value="${m}" ${m === currentModel ? 'selected' : ''}>${m}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">เกรด / รุ่นย่อย (Grade)</label>
                    <select id="gradeSelect" onchange="onGradeChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                      ${gradesForModel.map((g) => `<option value="${g.id}">${g.grade} (${fmt(g.price)} ฿)</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ราคารถยนต์ (บาท)</label>
                    <input type="text" id="carPrice" value="0" oninput="calculateAll()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">เลือกสีรถ</label>
                    <select id="colorSelect" onchange="onColorChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold"></select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ค่าสีรถ (บาท)</label>
                    <input type="text" id="colorPrice" value="0" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ส่วนลดตัวรถ (-)</label>
                    <input type="text" id="discount" value="0" oninput="calculateAll()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">บวกอุปกรณ์ (บาท)</label>
                    <input type="text" id="accessories" value="0" oninput="calculateAll()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                  </div>
                  <div class="sm:col-span-2 bg-blue-50 p-4 rounded-2xl flex justify-between items-center">
                    <span class="text-xs font-bold text-blue-900">ราคารถยนต์สุทธิ (ราคารถ − ส่วนลด + ค่าสี + อุปกรณ์)</span>
                    <span id="resNetPriceFull" class="text-base font-bold text-blue-700">0 ฿</span>
                  </div>
                </div>
              </div>

              <!-- แผนคำนวณ 4 แผน (Plans 1-4) -->
              <div class="space-y-4">
                ${state.plans.map((p, pIdx) => {
                  const cp = availableCampaigns[p.campaignIdx] || availableCampaigns[0] || {};
                  const netPrice = getNetPriceWithoutDown();
                  const downAmtVal = num(p.downAmt);
                  const downPctVal = netPrice > 0 ? Math.round((downAmtVal / netPrice) * 100) : p.downPct;
                  
                  let matchedPct = 25;
                  [30, 25, 20, 15, 10, 5].forEach(t => { if (downPctVal >= t) matchedPct = t; });
                  if (downPctVal < 5) matchedPct = 5;

                  const rTable = cp && cp.rates && cp.rates[matchedPct] ? cp.rates[matchedPct] : {};
                  const autoRate = rTable[p.term] ? num(rTable[p.term]) : 2.79;
                  const currentRate = p.customRate !== '' ? p.customRate : autoRate;

                  return `
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
                      <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                        <h3 class="font-bold text-slate-800 text-sm sm:text-base">📋 รายละเอียดไฟแนนซ์และแคมเปญดอกเบี้ย</h3>
                        <button onclick="togglePlan(${p.id})" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition-all">
                          ${p.name} (${p.isOpen ? 'เปิดอยู่ 🔽' : 'ปิดอยู่ ◀'})
                        </button>
                      </div>

                      <div class="${p.isOpen ? 'grid' : 'hidden'} grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label class="block text-xs font-medium text-slate-500 mb-1">เลือกแคมเปญไฟแนนซ์</label>
                          <select onchange="updatePlan(${p.id}, 'campaignIdx', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                            ${availableCampaigns.map((c, i) => `<option value="${i}" ${p.campaignIdx == i ? 'selected' : ''}>[${c.finance}] รุ่น: ${c.name}</option>`).join('')}
                          </select>
                        </div>
                        <div>
                          <label class="block text-xs font-medium text-slate-500 mb-1">จำนวนเดือน (Term)</label>
                          <input type="number" value="${p.term}" oninput="updatePlan(${p.id}, 'term', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                        </div>
                        <div>
                          <label class="block text-xs font-medium text-slate-500 mb-1">เปอร์เซ็นต์ดาวน์ (%)</label>
                          <input type="number" id="plan-${p.id}-downPct" value="${p.downPct}" min="5" max="50" step="5" oninput="updatePlanDownPct(${p.id}, this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                        </div>
                        <div>
                          <label class="block text-xs font-medium text-slate-500 mb-1">ยอดเงินดาวน์ (บาท)</label>
                          <input type="text" id="plan-${p.id}-downAmt" value="${fmt(p.downAmt)}" oninput="updatePlanDownAmt(${p.id}, this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                        </div>
                        <div class="sm:col-span-2">
                          <label class="block text-xs font-medium text-slate-500 mb-1">อัตราดอกเบี้ย (% ต่อปี) <span class="text-blue-600 font-normal">(อัตโนมัติจากตาราง/แก้ไขเองได้)</span></label>
                          <input type="number" step="0.01" value="${currentRate}" oninput="updatePlan(${p.id}, 'customRate', this.value)" class="w-full bg-blue-50/50 border border-blue-200 rounded-xl p-3 text-sm font-semibold text-blue-800">
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>

            </div>

            <!-- Sidebar สรุปยอดผ่อน -->
            <div class="space-y-6">
              <div class="bg-slate-900 text-white rounded-3xl p-6 shadow-xl sticky top-24">
                <h3 class="font-bold text-slate-200 mb-4 pb-3 border-b border-slate-800 flex justify-between">
                  <span>📊 สรุปยอดคำนวณ</span>
                  <span class="text-xs text-blue-400">Cloud D1</span>
                </h3>
                <div class="space-y-3 text-sm mb-6">
                  <div class="flex justify-between text-slate-400"><span>ราคาสุทธิ:</span><span id="resNetPrice">0 ฿</span></div>
                </div>

                <div class="space-y-3" id="installmentCardsContainer">
                  ${state.plans.map(p => {
                    return `
                      <div class="bg-slate-800 p-4 rounded-2xl text-center ${p.isOpen ? '' : 'hidden'}" id="sidebar-card-${p.id}">
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-1">
                          <span>${p.name} (ผ่อน ${p.term} เดือน)</span>
                          <span class="text-blue-300 font-semibold">ดอกเบี้ย: <span id="sidebar-rate-${p.id}">0</span>%</span>
                        </div>
                        <div class="text-xs text-slate-300 mb-2 flex justify-between">
                          <span>ดาวน์: <span id="sidebar-down-${p.id}">0</span> ฿</span>
                          <span>ยอดจัด: <span id="sidebar-finance-${p.id}">0</span> ฿</span>
                        </div>
                        <div id="sidebar-inst-${p.id}" class="text-xl font-bold text-white">0 ฿ / เดือน</div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>

          </main>
        </div>
      `;
    }

    function renderSettings() {
      const brandObj = BRANDS.find(b => b.id === state.selectedBrand) || { name: 'CAR' };
      const carsForBrand = state.cars.filter(c => c.brand === state.selectedBrand);

      return `
        <div class="min-h-screen bg-slate-100 flex flex-col">
          <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center sticky top-0 z-30">
            <h1 class="font-bold text-sm sm:text-base">⚙️ ตั้งค่าข้อมูลแบรนด์: ${brandObj.name}</h1>
            <button onclick="state.step='calc';render();" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-semibold shadow-md transition-all">กลับหน้าคำนวณ</button>
          </header>
          <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-6">
            
            <!-- จัดการบริษัทไฟแนนซ์และแคมเปญดอกเบี้ย (ผูกกับชื่อรุ่นรถ) -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
              <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800">🏦 จัดการบริษัทไฟแนนซ์และแคมเปญดอกเบี้ย (ระบุชื่อรุ่นรถในชื่อแคมเปญ)</h3>
                ${state.editingCampaignIndex !== null ? `<button onclick="cancelEditCampaign()" class="text-xs text-red-500 font-semibold hover:underline">ยกเลิกการแก้ไข</button>` : ''}
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-medium text-slate-500 mb-1">บริษัทไฟแนนซ์</label>
                  <input type="text" id="financeCompanyInput" placeholder="เช่น กรุงศรี ออโต้, นิสสัน ลีสซิ่ง" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-500 mb-1">ชื่อแคมเปญ / ชื่อรุ่นรถ (เช่น URBAN)</label>
                  <input type="text" id="campaignNameInput" placeholder="ระบุชื่อรุ่นรถ เช่น URBAN" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                </div>
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">📸 แนบภาพถ่ายตารางดอกเบี้ยเพื่อให้ AI วิเคราะห์</label>

    async function selectBrand(brandId) {
      state.selectedBrand = brandId;
      state.step = 'calc';
      await loadDataFromCloud();
    }

    function initCalcValues() {
      if (document.getElementById('modelSelect')) {
        onModelChange();
      }
    }

    function onModelChange() {
      const selectedModel = document.getElementById('modelSelect').value;
      const gradesForModel = state.cars.filter(c => c.model === selectedModel);
      const gradeSel = document.getElementById('gradeSelect');
      if (gradeSel) {
        gradeSel.innerHTML = gradesForModel.map(g => `<option value="${g.id}">${g.grade} (${fmt(g.price)} ฿)</option>`).join('');
        onGradeChange();
      }
    }

    function onGradeChange() {
      const carId = document.getElementById('gradeSelect').value;
      const car = state.cars.find(c => c.id == carId);
      if (car) {
        document.getElementById('carPrice').value = car.price;
        const colorSel = document.getElementById('colorSelect');
        colorSel.innerHTML = (car.colors || []).map((col, i) => `<option value="${i}" data-price="${col.price}">${col.name} (+${fmt(col.price)}฿)</option>`).join('') || '<option value="0" data-price="0">สีมาตรฐาน</option>';
        onColorChange();
      }
    }

    function onColorChange() {
      const colorSel = document.getElementById('colorSelect');
      const opt = colorSel.options[colorSel.selectedIndex];
      document.getElementById('colorPrice').value = opt ? num(opt.getAttribute('data-price')) : 0;
      calculateAll();
    }

    // จัดการเปิด/ปิดแผน 1-4
    function togglePlan(planId) {
      const plan = state.plans.find(p => p.id === planId);
      if (plan) {
        plan.isOpen = !plan.isOpen;
        render();
        setTimeout(initCalcValues, 50);
      }
    }

    // อัปเดตค่าในแผนคำนวณ
    function updatePlan(planId, field, val) {
      const plan = state.plans.find(p => p.id === planId);
      if (plan) {
        plan[field] = val;
        calculateAll();
      }
    }

    function updatePlanDownPct(planId, pctVal) {
      const plan = state.plans.find(p => p.id === planId);
      if (plan) {
        plan.downPct = num(pctVal);
        const net = getNetPriceWithoutDown();
        const downAmt = Math.round(net * (plan.downPct / 100));
        plan.downAmt = downAmt;
        const downAmtInput = document.getElementById(`plan-${planId}-downAmt`);
        if (downAmtInput) downAmtInput.value = fmt(downAmt);
        calculateAll();
      }
    }

    function updatePlanDownAmt(planId, amtVal) {
      const plan = state.plans.find(p => p.id === planId);
      if (plan) {
        plan.downAmt = num(amtVal);
        const net = getNetPriceWithoutDown();
        if (net > 0) plan.downPct = Math.round((plan.downAmt / net) * 100);
        const downPctInput = document.getElementById(`plan-${planId}-downPct`);
        if (downPctInput) downPctInput.value = plan.downPct;
        calculateAll();
      }
    }

    function getNetPriceWithoutDown() {
      return (num(document.getElementById('carPrice')?.value) - num(document.getElementById('discount')?.value)) + num(document.getElementById('colorPrice')?.value) + num(document.getElementById('accessories')?.value);
    }

    // คำนวณยอดทั้งหมดและอัปเดต UI แบบเรียลไทม์
    function calculateAll() {
      const netPrice = getNetPriceWithoutDown();
      if (document.getElementById('resNetPriceFull')) document.getElementById('resNetPriceFull').innerText = fmt(netPrice) + ' ฿';
      if (document.getElementById('resNetPrice')) document.getElementById('resNetPrice').innerText = fmt(netPrice) + ' ฿';

      const currentModel = document.getElementById('modelSelect') ? document.getElementById('modelSelect').value : '';
      const matchingCampaigns = state.campaigns.filter(cp => cp.name.toUpperCase() === currentModel.toUpperCase());
      const availableCampaigns = matchingCampaigns.length > 0 ? matchingCampaigns : state.campaigns;

      state.plans.forEach(p => {
        const cp = availableCampaigns[p.campaignIdx] || availableCampaigns[0] || {};
        const downPctVal = p.downPct;
        let matchedPct = 25;
        [30, 25, 20, 15, 10, 5].forEach(t => { if (downPctVal >= t) matchedPct = t; });
        if (downPctVal < 5) matchedPct = 5;

        const rTable = cp && cp.rates && cp.rates[matchedPct] ? cp.rates[matchedPct] : {};
        const autoRate = rTable[p.term] ? num(rTable[p.term]) : 2.79;
        const rateVal = p.customRate !== '' ? num(p.customRate) : autoRate;

        const down = num(p.downAmt);
        const finance = Math.max(netPrice - down, 0);
        const totalPay = finance + (finance * (rateVal / 100) * (p.term / 12));
        const monthly = p.term > 0 ? Math.ceil(totalPay / p.term) : 0;

        // อัปเดต Sidebar Card
        const rateSpan = document.getElementById(`sidebar-rate-${p.id}`);
        const downSpan = document.getElementById(`sidebar-down-${p.id}`);
        const financeSpan = document.getElementById(`sidebar-finance-${p.id}`);
        const instSpan = document.getElementById(`sidebar-inst-${p.id}`);

        if (rateSpan) rateSpan.innerText = rateVal;
        if (downSpan) downSpan.innerText = fmt(down);
        if (financeSpan) financeSpan.innerText = fmt(finance);
        if (instSpan) instSpan.innerText = fmt(monthly) + ' ฿ / เดือน';
      });
    }

    // กำหนดสีรถเพิ่มเติม
    function addColorRow(name = '', price = 0) {
      const container = document.getElementById('colorRowsContainer');
      const div = document.createElement('div');
      div.className = 'flex gap-2 items-center color-row';
      div.innerHTML = `
        <input type="text" placeholder="ชื่อสี (เช่น LAVENDER PURPLE)" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold color-name-input" value="${name}">
        <input type="number" placeholder="ค่าสี (บาท เช่น 7000)" class="w-40 bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold color-price-input" value="${price}">
        <button type="button" onclick="removeColorRow(this)" class="px-3 py-3 text-red-500 hover:bg-red-50 rounded-xl text-sm font-semibold">❌</button>
      `;
      container.appendChild(div);
    }

    function removeColorRow(btn) {
      const row = btn.parentElement;
      if (document.querySelectorAll('.color-row').length > 1) {
        row.remove();
      } else {
        alert('ต้องมีรายการสีอย่างน้อย 1 รายการ');
      }
    }

    // AI Vision / Fallback handler
    async function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);
      const uploadInput = event.target;
      const parentContainer = uploadInput.parentElement;
      let statusLabel = document.createElement('div');
      statusLabel.className = 'text-xs text-blue-600 font-bold mt-1';
      statusLabel.innerText = '🤖 กำลังให้ AI วิเคราะห์ตารางดอกเบี้ย กรุณารอสักครู่...';
      parentContainer.appendChild(statusLabel);

      try {
        const response = await fetch('/api/extract-rates', { method: 'POST', body: formData });
        if (!response.ok) throw new Error('API extraction endpoint not available');
        const extractedData = await response.json();
        if (extractedData.rates) fillRateTable(extractedData.rates);
        if (extractedData.finance_company) document.querySelector('#financeCompanyInput').value = extractedData.finance_company;
        if (extractedData.campaign_name) document.querySelector('#campaignNameInput').value = extractedData.campaign_name;
        statusLabel.className = 'text-xs text-green-600 font-bold mt-1';
        statusLabel.innerText = '✅ AI วิเคราะห์และเติมข้อมูลตารางดอกเบี้ยสำเร็จ!';
        setTimeout(() => statusLabel.remove(), 4000);
      } catch (err) {
        const mockRates = {
          30: { 24: '1.89', 36: '1.99', 48: '2.09', 60: '2.45', 72: '2.75', 84: '3.40', 96: '-' },
          25: { 24: '1.99', 36: '2.09', 48: '2.19', 60: '2.45', 72: '2.75', 84: '3.40', 96: '-' },
          20: { 24: '2.09', 36: '2.19', 48: '2.45', 60: '2.65', 72: '3.10', 84: '3.65', 96: '-' },
          15: { 24: '2.19', 36: '2.29', 48: '2.95', 60: '3.20', 72: '3.50', 84: '4.25', 96: '-' },
          10: { 24: '2.29', 36: '2.39', 48: '3.49', 60: '3.89', 72: '4.09', 84: '4.79', 96: '-' },
          5:  { 24: '2.39', 36: '2.49', 48: '3.89', 60: '4.35', 72: '4.59', 84: '5.15', 96: '-' }
        };
        fillRateTable(mockRates);
        if (!document.querySelector('#financeCompanyInput').value) document.querySelector('#financeCompanyInput').value = 'กรุงศรี ออโต้';
        if (!document.querySelector('#campaignNameInput').value) document.querySelector('#campaignNameInput').value = 'URBAN';
        statusLabel.className = 'text-xs text-emerald-600 font-bold mt-1';
        statusLabel.innerText = '✅ AI (Simulated) วิเคราะห์ตารางดอกเบี้ยสำเร็จ!';
        setTimeout(() => statusLabel.remove(), 4000);
      }
    }

    function fillRateTable(rates) {
      for (const [down, terms] of Object.entries(rates)) {
        for (const [month, rate] of Object.entries(terms)) {
          if (rate !== null && rate !== undefined) {
            const input = document.querySelector(`input[data-down="${down}"][data-month="${month}"]`);
            if (input) input.value = rate;
          }
        }
      }
    }

    // CRUD Campaigns
    async function saveCampaign() {
      const finance = document.getElementById('financeCompanyInput').value.trim();
      const name = document.getElementById('campaignNameInput').value.trim().toUpperCase();

      if (!finance || !name) {
        alert('กรุณากรอกชื่อบริษัทไฟแนนซ์และชื่อรุ่นรถ/แคมเปญให้ครบถ้วน');
        return;
      }

      const rates = {};
      [30, 25, 20, 15, 10, 5].forEach(down => {
        rates[down] = {};
        [24, 36, 48, 60, 72, 84, 96].forEach(month => {
          const input = document.querySelector(`input[data-down="${down}"][data-month="${month}"]`);
          const val = input ? input.value.trim() : '-';
          rates[down][month] = (val && val !== '-' && val !== '') ? parseFloat(val) : null;
        });
      });

      const campaignData = { finance, name, rates };

      if (state.editingCampaignIndex !== null) {
        state.campaigns[state.editingCampaignIndex] = campaignData;
        state.editingCampaignIndex = null;
        alert('✅ อัปเดตแคมเปญไฟแนนซ์เรียบร้อยแล้ว!');
      } else {
        state.campaigns.push(campaignData);
        alert('✅ บันทึกแคมเปญไฟแนนซ์และเรทดอกเบี้ยเรียบร้อยแล้ว!');
      }

      document.getElementById('financeCompanyInput').value = '';
      document.getElementById('campaignNameInput').value = '';
      render();
    }

    function editCampaign(index) {
      const cp = state.campaigns[index];
      if (!cp) return;
      state.editingCampaignIndex = index;
      document.getElementById('financeCompanyInput').value = cp.finance;
      document.getElementById('campaignNameInput').value = cp.name;

      if (cp.rates) {
        for (const [down, terms] of Object.entries(cp.rates)) {
          for (const [month, rate] of Object.entries(terms)) {
            const input = document.querySelector(`input[data-down="${down}"][data-month="${month}"]`);
            if (input) input.value = (rate !== null && rate !== undefined) ? rate : '-';
          }
        }
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
    }

    function cancelEditCampaign() {
      state.editingCampaignIndex = null;
      render();
    }

    function deleteCampaign(index) {
      if (confirm('คุณต้องการลบแคมเปญนี้ใช่หรือไม่?')) {
        state.campaigns.splice(index, 1);
        render();
      }
    }

    // CRUD Cars
    async function addNewCarModel(e) {
      e.preventDefault();
      const model = document.getElementById('newModelName').value.trim().toUpperCase();
      const grade = document.getElementById('newGradeName').value.trim().toUpperCase();
      const price = num(document.getElementById('newPrice').value);

      const colors = [];
      document.querySelectorAll('.color-row').forEach(row => {
        const cName = row.querySelector('.color-name-input').value.trim();
        const cPrice = num(row.querySelector('.color-price-input').value);
        if (cName) colors.push({ name: cName, price: cPrice });
      });

      if (state.editingCarId !== null) {
        const car = state.cars.find(c => c.id == state.editingCarId);
        if (car) {
          car.model = model;
          car.grade = grade;
          car.price = price;
          car.colors = colors;
        }
        state.editingCarId = null;
        alert('✅ อัปเดตข้อมูลรุ่นรถเรียบร้อยแล้ว!');
      } else {
        const newCar = {
          id: Date.now(),
          brand: state.selectedBrand,
          model,
          grade,
          price,
          colors: colors.length > 0 ? colors : [{ name: 'สีมาตรฐาน', price: 0 }]
        };
        state.cars.push(newCar);
        alert('✅ บันทึกข้อมูลรุ่นรถสำเร็จ!');
      }

      document.getElementById('newModelName').value = '';
      document.getElementById('newGradeName').value = '';
      document.getElementById('newPrice').value = '';
      render();
    }

    function editCar(id) {
      const car = state.cars.find(c => c.id == id);
      if (!car) return;
      state.editingCarId = id;
      document.getElementById('newModelName').value = car.model;
      document.getElementById('newGradeName').value = car.grade;
      document.getElementById('newPrice').value = car.price;

      const container = document.getElementById('colorRowsContainer');
      container.innerHTML = '';
      if (car.colors && car.colors.length > 0) {
        car.colors.forEach(c => addColorRow(c.name, c.price));
      } else {
        addColorRow('สีมาตรฐาน', 0);
      }
      render();
    }

    function cancelEditCar() {
      state.editingCarId = null;
      render();
    }

    function deleteCar(id) {
      if (confirm('คุณต้องการลบข้อมูลรุ่นรถนี้ใช่หรือไม่?')) {
        state.cars = state.cars.filter(c => c.id != id);
        render();
      }
    }

    render();
  </script>
</body>
</html>
