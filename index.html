<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Multi-Brand Car Finance & Quotation Pro (Cloudflare D1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'sans-serif'] },
          colors: {
            slate: { 850: '#182030', 900: '#0f172a', 950: '#080c14' },
            brand: { DEFAULT: '#2563eb', 600: '#1d4ed8', 700: '#1e40af' }
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; color: #1e293b; }
    @media print { .no-print { display: none !important; } body { background: white !important; } }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    const AVAILABLE_MONTHS = [24, 36, 48, 60, 72, 84, 96];
    const BRANDS = [
      { id: 'toyota', name: 'TOYOTA', img: 'https://img1.pic.in.th/images/Toyota.png' },
      { id: 'honda', name: 'HONDA', img: 'https://img2.pic.in.th/Honda.png' },
      { id: 'isuzu', name: 'ISUZU', img: 'https://img1.pic.in.th/images/Isuzu.png' },
      { id: 'nissan', name: 'NISSAN', img: 'https://img2.pic.in.th/Nissan.png' },
      { id: 'mitsubishi', name: 'MITSUBISHI', img: 'https://img2.pic.in.th/Mitsubishi.png' },
      { id: 'ford', name: 'FORD', img: 'https://img1.pic.in.th/images/Ford.png' },
      { id: 'mazda', name: 'MAZDA', img: 'https://img1.pic.in.th/images/Mazda.png' },
      { id: 'suzuki', name: 'SUZUKI', img: 'https://img1.pic.in.th/images/Suzuki.png' },
      { id: 'kia', name: 'KIA', img: 'https://img2.pic.in.th/Kia.png' },
      { id: 'byd', name: 'BYD', img: 'https://img2.pic.in.th/BYD.png' },
      { id: 'omoda_jaecoo', name: 'OMODA & JAECOO', img: 'https://img2.pic.in.th/OJ.png' },
      { id: 'mg', name: 'MG', img: 'https://img2.pic.in.th/MG.png' },
      { id: 'gac_aion', name: 'GAC AION', img: 'https://img2.pic.in.th/Aion.png' },
      { id: 'geely', name: 'GEELY', img: 'https://img2.pic.in.th/Geely.png' },
      { id: 'Changan', name: 'CHANGAN', img: 'https://img1.pic.in.th/images/Changan.png' },
      { id: 'gwm', name: 'GWM', img: 'https://img2.pic.in.th/GWM.png' },
      { id: 'chery', name: 'CHERY', img: 'https://img1.pic.in.th/images/Chery.png' },
      { id: 'icar', name: 'iCAR', img: 'https://img1.pic.in.th/images/iCAR.png' },
      { id: 'lepas', name: 'LEPAS', img: 'https://img2.pic.in.th/Lepas.png' },
      { id: 'Tesla', name: 'TESLA', img: 'https://img1.pic.in.th/images/Tesla.png' }
    ];

    let state = {
      step: 'brand',
      selectedBrand: null,
      company: { name: 'บริษัท เมกา ออโตโมบิล ติวานนท์ จำกัด', address: '59/3 หมู่ 4 ตำบลบ้านใหม่ อำเภอเมืองปทุมธานี จังหวัดปทุมธานี 12000' },
      cars: [],
      campaigns: []
    };

    const fmt = n => (Number(n) || 0).toLocaleString('th-TH');
    const num = s => { const p = parseFloat(String(s).replace(/[^0-9.]/g, '')); return isNaN(p) ? 0 : p; };

    async function loadDataFromCloud() {
      try {
        const [carsRes, campRes] = await Promise.all([
          fetch(`/api/cars?brand=${state.selectedBrand}`),
          fetch('/api/campaigns')
        ]);
        state.cars = await carsRes.json();
        state.campaigns = await campRes.json();
        render();
      } catch (err) {
        console.error("Error loading data from D1:", err);
      }
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '';
      if (state.step === 'brand') app.innerHTML = renderBrandSelector();
      else if (state.step === 'calc') app.innerHTML = renderCalculator();
      else if (state.step === 'settings') app.innerHTML = renderSettings();
    }

    function renderBrandSelector() {
      return `
        <div class="min-h-screen flex flex-col justify-center items-center p-6 bg-gradient-to-br from-slate-900 to-slate-950 text-white">
          <div class="max-w-4xl w-full text-center mb-10">
            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30">CLOUD-DATABASE PRO (D1)</span>
            <h1 class="text-3xl sm:text-4xl font-bold mt-3">เลือกแบรนด์รถยนต์ที่ต้องการคำนวณ</h1>
          </div>
          <div class="max-w-4xl w-full grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            ${BRANDS.map(b => `
              <button onclick="selectBrand('${b.id}')" class="group flex flex-col items-center justify-center p-5 rounded-2xl bg-slate-800/60 border border-slate-700 hover:border-blue-500 transition-all shadow-lg">
                <div class="w-12 h-12 mb-3 flex items-center justify-center bg-white/10 rounded-xl p-2">
                  <img src="${b.img}" alt="${b.name}" class="max-h-full max-w-full object-contain">
                </div>
                <span class="font-semibold text-xs text-slate-200 text-center">${b.name}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCalculator() {
      const brandObj = BRANDS.find(b => b.id === state.selectedBrand) || { name: 'CAR', img: '' };
      const uniqueModels = [...new Set(state.cars.map(c => c.model))];
      const currentModel = document.getElementById('modelSelect')?.value || uniqueModels[0] || '';
      const gradesForModel = state.cars.filter(c => c.model === currentModel);

      const campIdx = document.getElementById('campSelect') ? document.getElementById('campSelect').value : 0;
      const cp = state.campaigns[campIdx] || state.campaigns[0] || {};
      const downPct = document.getElementById('downPct') ? num(document.getElementById('downPct').value) : 25;
      let matchedPct = 25;
      [30, 25, 20, 15, 10, 5].forEach(t => { if (downPct >= t) matchedPct = t; });
      if (downPct < 5) matchedPct = 5;

      const rTable = cp && cp.rates && cp.rates[matchedPct] ? cp.rates[matchedPct] : {};
      const activeMonths = AVAILABLE_MONTHS.filter(m => num(rTable[m]) > 0);

      return `
        <div class="min-h-screen flex flex-col">
          <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center sticky top-0 z-30">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 bg-white/10 rounded-xl p-1.5 flex items-center justify-center">
                <img src="${brandObj.img}" class="max-h-full max-w-full object-contain">
              </div>
              <div>
                <h1 class="font-bold text-base">${brandObj.name} FINANCE CALCULATOR</h1>
                <p class="text-xs text-slate-400">${state.company.name}</p>
              </div>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="state.step='settings';render()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold">⚙️ ตั้งค่ารุ่นรถ/ดอกเบี้ย</button>
              <button onclick="state.step='brand';render()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold">เปลี่ยนแบรนด์</button>
            </div>
          </header>

          <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
              <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-800 mb-4">🚗 ข้อมูลรถยนต์</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ชื่อรุ่นรถ (Model)</label>
                    <select id="modelSelect" onchange="onModelChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                      ${uniqueModels.map(m => `<option value="${m}" ${m === currentModel ? 'selected' : ''}>${m}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">เกรด / รุ่นย่อย (Grade)</label>
                    <select id="gradeSelect" onchange="onGradeChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                      ${gradesForModel.map((g) => `<option value="${g.id}">${g.grade} (${fmt(g.price)} ฿)</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ราคารถยนต์ (บาท)</label>
                    <input type="text" id="carPrice" value="0" oninput="calculate()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">เลือกสีรถ</label>
                    <select id="colorSelect" onchange="onColorChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold"></select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ค่าสีรถ (บาท)</label>
                    <input type="text" id="colorPrice" value="0" readonly class="w-full bg-slate-100 border border-slate-200 rounded-xl p-3 text-sm font-semibold text-slate-600">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ส่วนลดตัวรถ (-)</label>
                    <input type="text" id="discount" value="0" oninput="calculate()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">บวกอุปกรณ์ (บาท)</label>
                    <input type="text" id="accessories" value="0" oninput="calculate()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                  </div>
                  <div class="sm:col-span-2 bg-blue-50 p-4 rounded-2xl flex justify-between items-center">
                    <span class="text-xs font-bold text-blue-900">ราคารถยนต์สุทธิ (ราคารถ − ส่วนลด + ค่าสี + อุปกรณ์)</span>
                    <span id="resNetPriceFull" class="text-base font-bold text-blue-700">0 ฿</span>
                  </div>
                </div>
              </div>

              <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-800 mb-4">📋 รายละเอียดไฟแนนซ์และแคมเปญดอกเบี้ย</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">เลือกแคมเปญไฟแนนซ์</label>
                    <select id="campSelect" onchange="onCampaignChange()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                      ${state.campaigns.map((cp, i) => `<option value="${i}">[${cp.finance}] ${cp.name}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">อัตราดอกเบี้ย (% ต่อปี)</label>
                    <input type="number" step="0.01" id="interestRate" value="2.79" oninput="calculate()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">เปอร์เซ็นต์ดาวน์ (%)</label>
                    <input type="number" id="downPct" value="25" min="5" max="50" step="5" oninput="calcDownByPct()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ยอดเงินดาวน์ (บาท)</label>
                    <input type="text" id="downAmt" value="0" oninput="calcDownByAmt()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold">
                  </div>
                </div>
              </div>
            </div>

            <div class="space-y-6">
              <div class="bg-slate-900 text-white rounded-3xl p-6 shadow-xl sticky top-24">
                <h3 class="font-bold text-slate-200 mb-4 pb-3 border-b border-slate-800 flex justify-between">
                  <span>📊 สรุปยอดคำนวณ</span>
                  <span class="text-xs text-blue-400">Cloud D1</span>
                </h3>
                <div class="space-y-3 text-sm mb-6">
                  <div class="flex justify-between text-slate-400"><span>ราคาสุทธิ:</span><span id="resNetPrice">0 ฿</span></div>
                  <div class="flex justify-between text-slate-400"><span>เงินดาวน์:</span><span id="resDown">0 ฿</span></div>
                  <div class="flex justify-between text-slate-400"><span>ยอดจัด:</span><span id="resFinance">0 ฿</span></div>
                </div>
                <div class="space-y-3" id="installmentCardsContainer">
                  ${AVAILABLE_MONTHS.map(m => `
                    <div class="bg-slate-800 p-3 rounded-2xl text-center ${activeMonths.includes(m) ? '' : 'hidden'}" id="card-inst-${m}">
                      <span class="text-xs text-slate-400 block">ผ่อน ${m} เดือน</span>
                      <span id="inst${m}" class="text-xl font-bold text-white">0 ฿</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </main>
        </div>
      `;
    }

    function renderSettings() {
      const brandObj = BRANDS.find(b => b.id === state.selectedBrand) || { name: 'CAR' };
      const groupedModels = {};
      state.cars.forEach(c => {
        if (!groupedModels[c.model]) groupedModels[c.model] = [];
        groupedModels[c.model].push(c);
      });

      const campaigns = Array.isArray(state.campaigns) ? state.campaigns : [];

      return `
        <div class="min-h-screen bg-slate-100 flex flex-col">
          <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
            <h1 class="font-bold">⚙️ ตั้งค่าข้อมูลแบรนด์ (Cloud D1): ${brandObj.name}</h1>
            <button onclick="state.step='calc';render();setTimeout(initCalcValues, 50);" class="px-4 py-2 bg-slate-800 rounded-xl text-xs">กลับหน้าคำนวณ</button>
          </header>
          <main class="max-w-4xl w-full mx-auto p-6 space-y-6">
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
              <h3 class="font-bold text-slate-800 mb-4">➕ เพิ่มชื่อรุ่นและเกรดรถใหม่</h3>
              <form onsubmit="addNewCarModel(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <input type="text" id="newModelName" placeholder="ชื่อรุ่น (เช่น URBAN)" required class="bg-slate-50 border rounded-xl p-3 text-sm">
                  <input type="text" id="newGradeName" placeholder="เกรด (เช่น STANDARD)" required class="bg-slate-50 border rounded-xl p-3 text-sm">
                  <input type="number" id="newPrice" placeholder="ราคารถ (บาท)" required class="bg-slate-50 border rounded-xl p-3 text-sm">
                </div>
                <div class="pt-3 border-t">
                  <label class="block text-xs font-semibold mb-2">กำหนดสีรถและค่าสี</label>
                  <div id="colorInputsContainer" class="space-y-2">
                    <div class="flex gap-2">
                      <input type="text" placeholder="ชื่อสี (เช่น WHITE)" class="color-name-input flex-1 bg-slate-50 border rounded-xl p-2 text-xs">
                      <input type="number" placeholder="ค่าสี (บาท)" class="color-price-input w-40 bg-slate-50 border rounded-xl p-2 text-xs">
                    </div>
                  </div>
                  <button type="button" onclick="addColorRow()" class="mt-2 text-xs text-blue-600 font-semibold">+ เพิ่มสีอื่นๆ</button>
                </div>
                <div class="flex justify-end pt-2">
                  <button type="submit" class="px-6 py-3 bg-blue-600 text-white rounded-xl text-sm font-semibold">บันทึกข้อมูลลงคลาวด์</button>
                </div>
              </form>
            </div>

            <!-- จัดการบริษัทไฟแนนซ์และแคมเปญดอกเบี้ย -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
              <h3 class="font-bold text-slate-800 mb-4">🏦 จัดการบริษัทไฟแนนซ์และแคมเปญดอกเบี้ย</h3>
              <div class="space-y-4">
                ${campaigns.map((cp, cIdx) => `
                  <div class="border border-slate-200 rounded-2xl p-4 bg-slate-50/50 space-y-3">
                    <div class="flex justify-between items-center">
                      <span class="font-bold text-sm text-blue-900">${cp.finance || ''} - ${cp.name || ''}</span>
                      <div class="flex gap-2">
                        <button onclick="openEditCampaign(${cIdx})" class="text-blue-600 text-xs font-semibold px-2.5 py-1 bg-blue-50 rounded-lg">แก้ไข</button>
                        <button onclick="deleteCampaign(${cIdx})" class="text-red-500 text-xs font-semibold px-2.5 py-1 bg-red-50 rounded-lg">ลบ</button>
                      </div>
                    </div>
                    ${cp.imageRef ? `<div class="mt-2"><img src="${cp.imageRef}" class="max-h-32 rounded-lg border border-slate-200 object-contain" alt="Reference"></div>` : ''}
                    <div class="text-xs text-slate-600 grid grid-cols-2 sm:grid-cols-6 gap-2 bg-white p-3 rounded-xl border border-slate-100">
                      ${[30, 25, 20, 15, 10, 5].map(pct => {
                        const r = cp.rates && cp.rates[pct] ? cp.rates[pct] : {};
                        return `<div><b>ดาวน์ ${pct}%:</b> ` + AVAILABLE_MONTHS.map(m => r[m] ? `${m}m(${r[m]}%)` : '').filter(Boolean).join(', ') + `</div>`;
                      }).join('')}
                    </div>
                  </div>
                `).join('')}

                <form id="campForm" onsubmit="saveCampaign(event)" class="pt-4 border-t border-slate-100 space-y-4">
                  <input type="hidden" id="editCampIndex" value="-1">
                  <h4 class="font-semibold text-xs text-slate-700" id="campFormTitle">➕ เพิ่มแคมเปญไฟแนนซ์ใหม่ (กรอกตารางดอกเบี้ย หรือแนบรูปภาพอ้างอิง)</h4>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" id="newFinName" placeholder="บริษัทไฟแนนซ์ (เช่น กรุงศรี ออโต้)" required class="bg-slate-50 border rounded-xl p-2.5 text-xs">
                    <input type="text" id="newCampName" placeholder="ชื่อแคมเปญ (เช่น แคมเปญมาตรฐาน)" required class="bg-slate-50 border rounded-xl p-2.5 text-xs">
                  </div>
                  <div>
                    <label class="block text-[11px] text-slate-500 mb-1">📸 แนบภาพถ่ายตารางดอกเบี้ยเพื่อดูอ้างอิงขณะกรอก (ไม่บังคับ)</label>
                    <input type="file" id="campImageFile" accept="image/*" onchange="previewCampImage(this)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-50 file:text-blue-700">
                    <div id="campImagePreviewContainer" class="mt-2 hidden">
                      <img id="campImagePreview" class="max-h-40 rounded-xl border object-contain">
                      <button type="button" onclick="clearCampImage()" class="text-red-500 text-[11px] mt-1 underline">ลบรูปภาพนี้</button>
                    </div>
                  </div>
                  <div>
                    <label class="block text-[11px] font-semibold text-slate-700 mb-2">ตารางอัตราดอกเบี้ย (% ต่อปี) แยกตาม % เงินดาวน์และจำนวนงวด</label>
                    <div class="overflow-x-auto">
                      <table class="w-full text-center text-xs border-collapse">
                        <thead>
                          <tr class="bg-slate-100 text-slate-700">
                            <th class="p-2 border">เงินดาวน์</th>
                            ${AVAILABLE_MONTHS.map(m => `<th class="p-2 border">${m} เดือน</th>`).join('')}
                          </tr>
                        </thead>
                        <tbody>
                          ${[30, 25, 20, 15, 10, 5].map(pct => `
                            <tr>
                              <td class="p-2 border font-semibold bg-slate-50">ดาวน์ ${pct}%</td>
                              ${AVAILABLE_MONTHS.map(m => `
                                <td class="p-2 border">
                                  <input type="text" inputmode="decimal" data-pct="${pct}" data-month="${m}" class="rate-matrix-input w-full bg-slate-50 border rounded-lg p-1.5 text-center text-xs" placeholder="-">
                                </td>
                              `).join('')}
                            </tr>
                          `).join('')}
                        </tbody>
                      </table>
                    </div>
                  </div>
                  <div class="flex gap-2 pt-2">
                    <button type="submit" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-semibold">บันทึกแคมเปญดอกเบี้ย</button>
                    <button type="button" onclick="resetCampForm()" class="px-4 py-2.5 bg-slate-200 text-slate-700 rounded-xl text-xs font-semibold">ล้างฟอร์ม</button>
                  </div>
                </form>
              </div>
            </div>

            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
              <h3 class="font-bold text-slate-800 mb-4">📋 รายการรุ่นรถในระบบคลาวด์</h3>
              <div class="space-y-4">
                ${Object.keys(groupedModels).map(modelName => `
                  <div class="border rounded-2xl p-4 bg-slate-50">
                    <h4 class="font-bold text-sm mb-2">🚗 ${modelName}</h4>
                    <div class="space-y-2">
                      ${groupedModels[modelName].map(c => `
                        <div class="bg-white p-3 rounded-xl border flex justify-between items-center text-xs">
                          <div><b>เกรด:</b> ${c.grade} | <b>ราคา:</b> ${fmt(c.price)} ฿</div>
                          <button onclick="deleteCarModel(${c.id})" class="text-red-500 font-semibold px-3 py-1 bg-red-50 rounded-lg">ลบ</button>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </main>
        </div>
      `;
    }

    let currentCampImageBase64 = '';
    function previewCampImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentCampImageBase64 = e.target.result;
          const prev = document.getElementById('campImagePreview');
          const cont = document.getElementById('campImagePreviewContainer');
          if (prev && cont) { prev.src = currentCampImageBase64; cont.classList.remove('hidden'); }
        };
        reader.readAsDataURL(input.files[0]);
      }
    }
    function clearCampImage() {
      currentCampImageBase64 = '';
      const fi = document.getElementById('campImageFile'); if (fi) fi.value = '';
      const cont = document.getElementById('campImagePreviewContainer'); if (cont) cont.classList.add('hidden');
    }

    function openEditCampaign(cIdx) {
      const cp = state.campaigns[cIdx]; if (!cp) return;
      document.getElementById('editCampIndex').value = cIdx;
      document.getElementById('newFinName').value = cp.finance || '';
      document.getElementById('newCampName').value = cp.name || '';
      document.getElementById('campFormTitle').innerText = '✏️ แก้ไขแคมเปญไฟแนนซ์';
      currentCampImageBase64 = cp.imageRef || '';
      if (currentCampImageBase64) {
        const prev = document.getElementById('campImagePreview');
        const cont = document.getElementById('campImagePreviewContainer');
        if (prev && cont) { prev.src = currentCampImageBase64; cont.classList.remove('hidden'); }
      } else { clearCampImage(); }

      document.querySelectorAll('.rate-matrix-input').forEach(input => {
        const pct = input.getAttribute('data-pct');
        const month = input.getAttribute('data-month');
        const val = cp.rates?.[pct]?.[month];
        input.value = (val !== 0 && val !== null && val !== undefined) ? val : '';
      });
      window.scrollTo({ top: document.getElementById('campForm').offsetTop - 100, behavior: 'smooth' });
    }

    function resetCampForm() {
      document.getElementById('editCampIndex').value = '-1';
      document.getElementById('newFinName').value = '';
      document.getElementById('newCampName').value = '';
      document.getElementById('campFormTitle').innerText = '➕ เพิ่มแคมเปญไฟแนนซ์ใหม่ (กรอกตารางดอกเบี้ย หรือแนบรูปภาพอ้างอิง)';
      clearCampImage();
      document.querySelectorAll('.rate-matrix-input').forEach(i => i.value = '');
    }

    async function saveCampaign(e) {
      e.preventDefault();
      const cIdx = parseInt(document.getElementById('editCampIndex').value);
      const finance = document.getElementById('newFinName').value.trim();
      const name = document.getElementById('newCampName').value.trim();

      const rates = {};
      [30, 25, 20, 15, 10, 5].forEach(pct => {
        rates[pct] = {};
        AVAILABLE_MONTHS.forEach(m => {
          const inp = document.querySelector(`.rate-matrix-input[data-pct="${pct}"][data-month="${m}"]`);
          const val = inp ? inp.value.trim() : '';
          rates[pct][m] = (val === '' || val === '-') ? 0 : num(val);
        });
      });

      const payload = {
        id: cIdx >= 0 ? state.campaigns[cIdx].id : null,
        finance,
        name,
        imageRef: currentCampImageBase64,
        rates
      };

      await fetch('/api/campaigns', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      await loadDataFromCloud();
      resetCampForm();
      render();
    }

    async function deleteCampaign(idOrIdx) {
      const cp = state.campaigns[idOrIdx];
      if (confirm('ต้องการลบแคมเปญนี้ใช่หรือไม่?')) {
        await fetch(`/api/campaigns?id=${cp.id}`, { method: 'DELETE' });
        await loadDataFromCloud();
        render();
      }
    }

    async function selectBrand(brandId) {
      state.selectedBrand = brandId;
      state.step = 'calc';
      await loadDataFromCloud();
      setTimeout(initCalcValues, 50);
    }

    function initCalcValues() { if (document.getElementById('modelSelect')) onModelChange(); }

    function onModelChange() {
      const selectedModel = document.getElementById('modelSelect')?.value;
      const gradesForModel = state.cars.filter(c => c.model === selectedModel);
      const gradeSel = document.getElementById('gradeSelect');
      if (gradeSel) {
        gradeSel.innerHTML = gradesForModel.map(g => `<option value="${g.id}">${g.grade} (${fmt(g.price)} ฿)</option>`).join('');
      }
      onGradeChange();
    }

    function onGradeChange() {
      const carId = document.getElementById('gradeSelect')?.value;
      const car = state.cars.find(c => c.id == carId);
      if (car) {
        document.getElementById('carPrice').value = car.price;
        const colorSel = document.getElementById('colorSelect');
        if (colorSel) {
          colorSel.innerHTML = (car.colors || []).map((col, i) => `<option value="${i}" data-price="${col.price}">${col.name}</option>`).join('') || '<option value="0" data-price="0">สีมาตรฐาน</option>';
        }
        onColorChange();
      }
    }

    function onColorChange() {
      const colorSel = document.getElementById('colorSelect');
      const opt = colorSel?.options[colorSel.selectedIndex];
      const cpInput = document.getElementById('colorPrice');
      if (cpInput) cpInput.value = opt ? num(opt.getAttribute('data-price')) : 0;
      calculate();
    }

    async function addNewCarModel(e) {
      e.preventDefault();
      const model = document.getElementById('newModelName').value.trim().toUpperCase();
      const grade = document.getElementById('newGradeName').value.trim().toUpperCase();
      const price = num(document.getElementById('newPrice').value);
      const colors = [];
      document.querySelectorAll('.color-name-input').forEach((el, idx) => {
        if (el.value.trim()) {
          colors.push({ name: el.value.trim().toUpperCase(), price: num(document.querySelectorAll('.color-price-input')[idx].value) });
        }
      });
      if (colors.length === 0) colors.push({ name: 'สีมาตรฐาน', price: 0 });

      await fetch('/api/cars', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ brand: state.selectedBrand, model, grade, price, colors })
      });
      await loadDataFromCloud();
      render();
    }

    async function deleteCarModel(id) {
      if (confirm('ต้องการลบรุ่นนี้จากคลาวด์ใช่หรือไม่?')) {
        await fetch(`/api/cars?id=${id}`, { method: 'DELETE' });
        await loadDataFromCloud();
        render();
      }
    }

    function calcDownByPct() {
      const net = getNetPriceWithoutDown();
      const down = Math.round(net * (num(document.getElementById('downPct').value) / 100));
      const da = document.getElementById('downAmt'); if (da) da.value = fmt(down);
      const rate = lookupInterestRate();
      const ir = document.getElementById('interestRate'); if (ir) ir.value = rate;
      calculate();
    }

    function calcDownByAmt() {
      const net = getNetPriceWithoutDown();
      const down = num(document.getElementById('downAmt').value);
      if (net > 0) {
        const dp = document.getElementById('downPct'); if (dp) dp.value = Math.round((down / net) * 100);
        const rate = lookupInterestRate();
        const ir = document.getElementById('interestRate'); if (ir) ir.value = rate;
      }
      calculate();
    }

    function getNetPriceWithoutDown() {
      return (num(document.getElementById('carPrice')?.value) - num(document.getElementById('discount')?.value)) + num(document.getElementById('colorPrice')?.value) + num(document.getElementById('accessories')?.value);
    }

    function lookupInterestRate() {
      const campSel = document.getElementById('campSelect');
      if (!campSel || !state.campaigns.length) return 2.79;
      const cp = state.campaigns[campSel.value] || state.campaigns[0];
      const downPct = num(document.getElementById('downPct')?.value);
      let matchedPct = 25;
      [30, 25, 20, 15, 10, 5].forEach(t => { if (downPct >= t) matchedPct = t; });
      if (downPct < 5) matchedPct = 5;
      const rateObj = cp.rates?.[matchedPct] || {};
      for (let m of AVAILABLE_MONTHS) {
        if (num(rateObj[m]) > 0) return num(rateObj[m]);
      }
      return 2.79;
    }

    function onCampaignChange() {
      const rate = lookupInterestRate();
      const ir = document.getElementById('interestRate'); if (ir) ir.value = rate;
      calculate();
    }

    function calculate() {
      const netPrice = getNetPriceWithoutDown();
      const down = num(document.getElementById('downAmt')?.value);
      const finance = Math.max(netPrice - down, 0);

      const rnpf = document.getElementById('resNetPriceFull'); if (rnpf) rnpf.innerText = fmt(netPrice) + ' ฿';
      const rnp = document.getElementById('resNetPrice'); if (rnp) rnp.innerText = fmt(netPrice) + ' ฿';
      const rd = document.getElementById('resDown'); if (rd) rd.innerText = fmt(down) + ' ฿';
      const rf = document.getElementById('resFinance'); if (rf) rf.innerText = fmt(finance) + ' ฿';

      const campSel = document.getElementById('campSelect');
      const cp = state.campaigns[campSel?.value] || state.campaigns[0] || {};
      const downPct = num(document.getElementById('downPct')?.value);
      let matchedPct = 25;
      [30, 25, 20, 15, 10, 5].forEach(t => { if (downPct >= t) matchedPct = t; });
      if (downPct < 5) matchedPct = 5;

      const rTable = cp.rates?.[matchedPct] || {};

      AVAILABLE_MONTHS.forEach(m => {
        const card = document.getElementById(`card-inst-${m}`);
        const span = document.getElementById(`inst${m}`);
        const rateVal = rTable[m];
        if (card && span && num(rateVal) > 0) {
          card.classList.remove('hidden');
          const totalPay = finance + (finance * (num(rateVal) / 100) * (m / 12));
          span.innerText = fmt(Math.ceil(totalPay / m)) + ' ฿ / เดือน';
        } else if (card) {
          card.classList.add('hidden');
        }
      });
    }

    function addColorRow() {
      document.getElementById('colorInputsContainer').insertAdjacentHTML('beforeend', `
        <div class="flex gap-2">
          <input type="text" placeholder="ชื่อสี (เช่น WHITE)" class="color-name-input flex-1 bg-slate-50 border rounded-xl p-2 text-xs">
          <input type="number" placeholder="ค่าสี (บาท)" class="color-price-input w-40 bg-slate-50 border rounded-xl p-2 text-xs">
        </div>
      `);
    }

    render();
  </script>
</body>
</html>
