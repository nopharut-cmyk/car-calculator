<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <title>Multi-Brand Car Finance & Quotation Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Prompt', 'sans-serif'] },
          colors: {
            slate: { 850: '#182030', 900: '#0f172a', 950: '#080c14' },
            brand: { DEFAULT: '#2563eb', 600: '#1d4ed8', 700: '#1e40af' }
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f1f5f9; color: #1e293b; }
    .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- APP ROOT CONTAINER -->
  <div id="app" class="flex-1 flex flex-col">
    <!-- หน้าจอจะถูกเรนเดอร์ด้วย JavaScript ตามสถานะผู้ใช้งาน -->
  </div>

  <script>
    /* ==========================================
       1. DEFAULT DATA & LOCALSTORAGE STATE
       ========================================== */
    const BRANDS = [
      { id: 'toyota', name: 'TOYOTA', logo: '🚗' },
      { id: 'honda', name: 'HONDA', logo: '🚙' },
      { id: 'isuzu', name: 'ISUZU', logo: '🛻' },
      { id: 'nissan', name: 'NISSAN', logo: '🚘' },
      { id: 'mitsubishi', name: 'MITSUBISHI', logo: '🚐' },
      { id: 'ford', name: 'FORD', logo: '🚚' },
      { id: 'mazda', name: 'MAZDA', logo: '🏎️' },
      { id: 'suzuki', name: 'SUZUKI', logo: '🚕' },
      { id: 'subaru', name: 'SUBARU', logo: '🚙' },
      { id: 'byd', name: 'BYD', logo: '⚡' },
      { id: 'omoda_jaecoo', name: 'OMODA & JAECOO', logo: '🌟' },
      { id: 'mg', name: 'MG', logo: '🔋' },
      { id: 'gac_aion', name: 'GAC AION', logo: '🌐' },
      { id: 'geely', name: 'GEELY', logo: '🧭' },
      { id: 'deepal', name: 'DEEPAL', logo: '🚀' },
      { id: 'gwm', name: 'GWM', logo: '🛡️' },
      { id: 'chery', name: 'CHERY', logo: '🎯' },
      { id: 'icar', name: 'iCAR', logo: '💡' },
      { id: 'lepas', name: 'LEPAS', logo: '💎' }
    ];

    let state = {
      step: 'brand', // 'brand' | 'setup' | 'calc' | 'settings'
      selectedBrand: null,
      company: JSON.parse(localStorage.getItem('car_calc_company') || JSON.stringify({
        name: 'บริษัท เมกา ออโตโมบิล ติวานนท์ จำกัด',
        address: '59/3 หมู่ 4 ตำบลบ้านใหม่ อำเภอเมืองปทุมธานี จังหวัดปทุมธานี 12000',
        phone: '02-xxx-xxxx',
        salesName: 'ที่ปรึกษาการขาย',
        salesPhone: '08x-xxx-xxxx'
      })),
      cars: JSON.parse(localStorage.getItem('car_calc_models') || JSON.stringify({
        toyota: [
          { model: 'Yaris Ativ', grade: 'Sport', price: 539000 },
          { model: 'Yaris Ativ', grade: 'Smart', price: 584000 },
          { model: 'Corolla Altis', grade: '1.8 Sport', price: 879000 }
        ],
        honda: [
          { model: 'City', grade: 'SV', price: 739000 },
          { model: 'Civic', grade: 'EL+', price: 989000 }
        ],
        nissan: [
          { model: 'KICKS e-POWER', grade: 'V', price: 759000 },
          { model: 'Almera', grade: 'VL', price: 699000 }
        ],
        byd: [
          { model: 'Atto 3', grade: 'Extended Range', price: 899900 },
          { model: 'Dolphin', grade: 'Standard', price: 559999 }
        ]
      })),
      rates: JSON.parse(localStorage.getItem('car_calc_rates') || JSON.stringify({
        defaultRate: 2.19,
        minDownPct: 15
      }))
    };

    function saveState() {
      localStorage.setItem('car_calc_company', JSON.stringify(state.company));
      localStorage.setItem('car_calc_models', JSON.stringify(state.cars));
      localStorage.setItem('car_calc_rates', JSON.stringify(state.rates));
    }

    const fmt = n => (Number(n) || 0).toLocaleString('th-TH');
    const num = s => parseFloat(String(s).replace(/[^0-9.]/g, '')) || 0;

    /* ==========================================
       2. VIEW CONTROLLER & RENDER ENGINE
       ========================================== */
    function render() {
      const app = document.getElementById('app');
      app.innerHTML = '';

      if (state.step === 'brand') {
        app.innerHTML = renderBrandSelector();
      } else if (state.step === 'setup') {
        app.innerHTML = renderCompanySetup();
      } else if (state.step === 'calc') {
        app.innerHTML = renderCalculator();
      } else if (state.step === 'settings') {
        app.innerHTML = renderSettings();
      }
    }

    // STEP 1: เลือกแบรนด์รถยนต์
    function renderBrandSelector() {
      return `
        <div class="min-h-screen flex flex-col justify-center items-center p-6 bg-gradient-to-br from-slate-900 via-slate-850 to-slate-950 text-white">
          <div class="max-w-4xl w-full text-center mb-10">
            <span class="px-3 py-1 rounded-full text-xs font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30">MULTI-BRAND FINANCE PRO</span>
            <h1 class="text-3xl sm:text-4xl font-bold mt-3 tracking-tight">เลือกแบรนด์รถยนต์ที่ต้องการคำนวณ</h1>
            <p class="text-slate-400 text-sm mt-2">ระบบคำนวณค่างวด ใบเสนอราคา และจัดการแคมเปญอัจฉริยะ</p>
          </div>
          <div class="max-w-4xl w-full grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            ${BRANDS.map(b => `
              <button onclick="selectBrand('${b.id}')" class="group flex flex-col items-center justify-center p-5 rounded-2xl bg-slate-800/60 border border-slate-700/60 hover:border-blue-500 hover:bg-slate-800 transition-all duration-200 shadow-lg hover:shadow-blue-500/10">
                <span class="text-3xl mb-2 group-hover:scale-110 transition-transform">${b.logo}</span>
                <span class="font-semibold text-sm tracking-wide text-slate-200">${b.name}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    // STEP 2: ตั้งค่าข้อมูลบริษัทและเซลล์ (ครั้งแรกหรือแก้ไข)
    function renderCompanySetup() {
      const c = state.company;
      return `
        <div class="min-h-screen flex items-center justify-center p-4 bg-slate-950 text-slate-100">
          <div class="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
            <div class="flex items-center space-x-3 mb-6">
              <div class="p-3 bg-blue-600/20 text-blue-400 rounded-xl text-xl">🏢</div>
              <div>
                <h2 class="text-xl font-bold">ตั้งค่าหัวใบเสนอราคา</h2>
                <p class="text-xs text-slate-400">ข้อมูลนี้จะถูกบันทึกไว้ใช้งานเฉพาะเครื่องของคุณ</p>
              </div>
            </div>
            <form onsubmit="saveCompanySetup(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">ชื่อบริษัท / โชว์รูม</label>
                <input type="text" id="compName" value="${c.name}" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">ที่อยู่โชว์รูม</label>
                <textarea id="compAddr" rows="2" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500">${c.address}</textarea>
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-medium text-slate-400 mb-1">ชื่อที่ปรึกษาการขาย</label>
                  <input type="text" id="salesName" value="${c.salesName}" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-400 mb-1">เบอร์โทรศัพท์เซลล์</label>
                  <input type="text" id="salesPhone" value="${c.salesPhone}" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500">
                </div>
              </div>
              <div class="pt-4 flex gap-3">
                <button type="button" onclick="state.step='brand';render()" class="w-1/3 bg-slate-800 hover:bg-slate-700 font-semibold py-3 rounded-xl text-sm transition">ย้อนกลับ</button>
                <button type="submit" class="w-2/3 bg-blue-600 hover:bg-blue-500 font-semibold py-3 rounded-xl text-sm transition shadow-lg shadow-blue-600/30">เข้าสู่โปรแกรมคำนวณ</button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // STEP 3: หน้าจอหลักโปรแกรมคำนวณค่างวด
    function renderCalculator() {
      const brandObj = BRANDS.find(b => b.id === state.selectedBrand) || { name: 'CAR', logo: '🚗' };
      const modelList = state.cars[state.selectedBrand] || [{ model: 'รุ่นมาตรฐาน', grade: 'เกรด A', price: 699000 }];

      return `
        <div class="min-h-screen flex flex-col">
          <!-- Top Navigation -->
          <header class="bg-slate-900 border-b border-slate-800 text-white px-6 py-4 flex justify-between items-center sticky top-0 z-30">
            <div class="flex items-center space-x-3">
              <span class="text-2xl">${brandObj.logo}</span>
              <div>
                <h1 class="font-bold text-base tracking-wide">${brandObj.name} FINANCE CALCULATOR</h1>
                <p class="text-xs text-slate-400">${state.company.name}</p>
              </div>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="state.step='settings';render()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">⚙️ ตั้งค่ารุ่นรถ/ดอกเบี้ย</button>
              <button onclick="state.step='brand';render()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold transition">เปลี่ยนแบรนด์</button>
            </div>
          </header>

          <!-- Main Calculator Body -->
          <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left: Inputs Form (2 Columns on lg) -->
            <div class="lg:col-span-2 space-y-6">
              <!-- Car Selection Card -->
              <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">🚗 ข้อมูลรถยนต์</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">รุ่นและเกรดรถ</label>
                    <select id="carSelect" onchange="updateCarPrice()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold focus:outline-none focus:border-blue-600">
                      ${modelList.map((c, idx) => `<option value="${idx}">${c.model} - ${c.grade} (${fmt(c.price)} ฿)</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ราคารถยนต์ (บาท)</label>
                    <input type="text" id="carPrice" value="${modelList[0].price}" oninput="calculate()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold focus:outline-none focus:border-blue-600">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ส่วนลดตัวรถ (-)</label>
                    <input type="text" id="discount" value="0" oninput="calculate()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold focus:outline-none focus:border-blue-600">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">อุปกรณ์ตกแต่งเพิ่มเติม (+)</label>
                    <input type="text" id="accessories" value="0" oninput="calculate()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold focus:outline-none focus:border-blue-600">
                  </div>
                </div>
              </div>

              <!-- Down Payment & Finance Card -->
              <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
                <h3 class="font-bold text-slate-800 mb-4 flex items-center gap-2">💰 เงินดาวน์และอัตราดอกเบี้ย</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">เปอร์เซ็นต์ดาวน์ (%)</label>
                    <input type="number" id="downPct" value="25" min="0" max="80" oninput="calcDownByPct()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold focus:outline-none focus:border-blue-600">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">ยอดเงินดาวน์ (บาท)</label>
                    <input type="text" id="downAmt" value="0" oninput="calcDownByAmt()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold focus:outline-none focus:border-blue-600">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">อัตราดอกเบี้ย (% ต่อปี)</label>
                    <input type="number" step="0.01" id="interestRate" value="${state.rates.defaultRate}" oninput="calculate()" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-semibold focus:outline-none focus:border-blue-600">
                  </div>
                </div>
              </div>
            </div>

            <!-- Right: Summary & Results Card (Sticky on lg) -->
            <div class="space-y-6">
              <div class="bg-slate-900 text-white rounded-3xl p-6 shadow-xl sticky top-24">
                <h3 class="font-bold text-slate-200 mb-4 pb-3 border-b border-slate-800 flex items-center justify-between">
                  <span>📊 สรุปยอดคำนวณ</span>
                  <span class="text-xs text-blue-400 font-normal">Real-time</span>
                </h3>
                
                <div class="space-y-3 text-sm">
                  <div class="flex justify-between text-slate-400">
                    <span>ราคาสุทธิรวมแต่ง:</span>
                    <span id="resNetPrice" class="text-white font-medium">0 ฿</span>
                  </div>
                  <div class="flex justify-between text-slate-400">
                    <span>เงินดาวน์สุทธิ:</span>
                    <span id="resDown" class="text-white font-medium">0 ฿</span>
                  </div>
                  <div class="flex justify-between text-slate-400">
                    <span>ยอดจัดไฟแนนซ์:</span>
                    <span id="resFinance" class="text-white font-medium">0 ฿</span>
                  </div>
                </div>

                <div class="mt-6 pt-4 border-t border-slate-800 space-y-4">
                  <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700/50 text-center">
                    <span class="text-xs text-slate-400 block mb-1">ค่างวดผ่อน 48 เดือน (4 ปี)</span>
                    <span id="installment48" class="text-2xl font-bold text-blue-400">0 ฿ / เดือน</span>
                  </div>
                  <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700/50 text-center">
                    <span class="text-xs text-slate-400 block mb-1">ค่างวดผ่อน 60 เดือน (5 ปี)</span>
                    <span id="installment60" class="text-2xl font-bold text-emerald-400">0 ฿ / เดือน</span>
                  </div>
                  <div class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700/50 text-center">
                    <span class="text-xs text-slate-400 block mb-1">ค่างวดผ่อน 84 เดือน (7 ปี)</span>
                    <span id="installment84" class="text-2xl font-bold text-amber-400">0 ฿ / เดือน</span>
                  </div>
                </div>

                <button onclick="window.print()" class="mt-6 w-full py-4 bg-blue-600 hover:bg-blue-500 font-semibold rounded-2xl transition shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2">
                  🖨️ พิมพ์ใบเสนอราคา / บันทึก PDF
                </button>
              </div>
            </div>
          </main>
        </div>
      `;
    }

    // STEP 4: หน้าจอตั้งค่า (Settings UI) เพิ่ม/แก้ไขรุ่นรถและดอกเบี้ย
    function renderSettings() {
      const brandObj = BRANDS.find(b => b.id === state.selectedBrand) || { name: 'CAR' };
      const modelList = state.cars[state.selectedBrand] || [];

      return `
        <div class="min-h-screen bg-slate-100 flex flex-col">
          <header class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center">
            <h1 class="font-bold">⚙️ ตั้งค่าข้อมูลแบรนด์: ${brandObj.name}</h1>
            <button onclick="state.step='calc';render()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold transition">กลับหน้าคำนวณ</button>
          </header>

          <main class="max-w-4xl w-full mx-auto p-6 space-y-6">
            <!-- Add Model Card -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
              <h3 class="font-bold text-slate-800 mb-4">➕ เพิ่มรุ่นและเกรดรถใหม่</h3>
              <form onsubmit="addNewCarModel(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label class="block text-xs font-medium text-slate-500 mb-1">ชื่อรุ่นรถ (Model)</label>
                  <input type="text" id="newModelName" placeholder="เช่น CR-V, Civic" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-600">
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-500 mb-1">เกรด / รุ่นย่อย (Grade)</label>
                  <input type="text" id="newGradeName" placeholder="เช่น 1.5 EL, RS" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-600">
                </div>
                <div>
                  <label class="block text-xs font-medium text-slate-500 mb-1">ราคารถตั้งต้น (บาท)</label>
                  <input type="number" id="newPrice" placeholder="999000" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-600">
                </div>
                <div class="sm:col-span-3 flex justify-end">
                  <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl text-sm transition shadow-md">บันทึกเพิ่มรุ่นรถ</button>
                </div>
              </form>
            </div>

            <!-- Existing Models List -->
            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200">
              <h3 class="font-bold text-slate-800 mb-4">📋 รายการรุ่นรถในระบบปัจจุบัน</h3>
              <div class="divide-y divide-slate-100">
                ${modelList.length === 0 ? '<p class="text-sm text-slate-400 py-4">ยังไม่มีรุ่นรถในแบรนด์นี้ สามารถเพิ่มผ่านฟอร์มด้านบนได้ทันที</p>' : ''}
                ${modelList.map((c, idx) => `
                  <div class="py-3 flex items-center justify-between">
                    <div>
                      <span class="font-bold text-slate-800">${c.model}</span>
                      <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-lg ml-2">${c.grade}</span>
                    </div>
                    <div class="flex items-center gap-4">
                      <span class="font-semibold text-blue-600 text-sm">${fmt(c.price)} ฿</span>
                      <button onclick="deleteCarModel(${idx})" class="text-red-500 hover:text-red-700 text-xs font-semibold px-3 py-1.5 bg-red-50 hover:bg-red-100 rounded-lg transition">ลบ</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </main>
        </div>
      `;
    }

    /* ==========================================
       3. LOGIC & EVENT HANDLERS
       ========================================== */
    function selectBrand(brandId) {
      state.selectedBrand = brandId;
      // หากยังไม่มีข้อมูลรถของแบรนด์นี้ ให้ใส่ค่าเริ่มต้นจำลอง
      if (!state.cars[brandId]) {
        state.cars[brandId] = [
          { model: 'รุ่นเรือธง (Flagship)', grade: 'Standard', price: 899000 },
          { model: 'รุ่นท็อป (Top Option)', grade: 'Premium', price: 1099000 }
        ];
        saveState();
      }
      state.step = 'calc';
      render();
      setTimeout(calculate, 50);
    }

    function saveCompanySetup(e) {
      e.preventDefault();
      state.company = {
        name: document.getElementById('compName').value,
        address: document.getElementById('compAddr').value,
        phone: '02-xxx-xxxx',
        salesName: document.getElementById('salesName').value,
        salesPhone: document.getElementById('salesPhone').value
      };
      saveState();
      state.step = 'calc';
      render();
      setTimeout(calculate, 50);
    }

    function updateCarPrice() {
      const idx = document.getElementById('carSelect').value;
      const modelList = state.cars[state.selectedBrand] || [];
      if (modelList[idx]) {
        document.getElementById('carPrice').value = modelList[idx].price;
        calculate();
      }
    }

    function calcDownByPct() {
      const price = num(document.getElementById('carPrice').value);
      const pct = num(document.getElementById('downPct').value);
      const downAmt = Math.round(price * (pct / 100));
      document.getElementById('downAmt').value = fmt(downAmt);
      calculate();
    }

    function calcDownByAmt() {
      const price = num(document.getElementById('carPrice').value);
      const downAmt = num(document.getElementById('downAmt').value);
      if (price > 0) {
        const pct = ((downAmt / price) * 100).toFixed(1);
        document.getElementById('downPct').value = pct;
      }
      calculate();
    }

    function calculate() {
      const price = num(document.getElementById('carPrice').value);
      const disc = num(document.getElementById('discount').value);
      const acc = num(document.getElementById('accessories').value);
      const down = num(document.getElementById('downAmt').value);
      const rate = num(document.getElementById('interestRate').value) / 100;

      const netPrice = (price - disc) + acc;
      const finance = Math.max(netPrice - down, 0);

      document.getElementById('resNetPrice').innerText = fmt(netPrice) + ' ฿';
      document.getElementById('resDown').innerText = fmt(down) + ' ฿';
      document.getElementById('resFinance').innerText = fmt(finance) + ' ฿';

      // คำนวณค่างวดแต่ละงวด (Flat Rate Formula)
      // ค่างวด = (ยอดจัด + (ยอดจัด * ดอกเบี้ย% * จำนวนปี)) / จำนวนเดือน
      const getInst = (months) => {
        if (finance <= 0) return 0;
        const years = months / 12;
        const totalInterest = finance * rate * years;
        const totalPay = finance + totalInterest;
        return Math.ceil(totalPay / months);
      };

      document.getElementById('installment48').innerText = fmt(getInst(48)) + ' ฿ / เดือน';
      document.getElementById('installment60').innerText = fmt(getInst(60)) + ' ฿ / เดือน';
      document.getElementById('installment84').innerText = fmt(getInst(84)) + ' ฿ / เดือน';
    }

    function addNewCarModel(e) {
      e.preventDefault();
      const mName = document.getElementById('newModelName').value;
      const gName = document.getElementById('newGradeName').value;
      const price = num(document.getElementById('newPrice').value);

      if (!state.cars[state.selectedBrand]) {
        state.cars[state.selectedBrand] = [];
      }
      state.cars[state.selectedBrand].push({ model: mName, grade: gName, price: price });
      saveState();
      render();
      alert('เพิ่มรุ่นรถเรียบร้อยแล้ว!');
    }

    function deleteCarModel(idx) {
      if (confirm('คุณต้องการลบรุ่นรถนี้ใช่หรือไม่?')) {
        state.cars[state.selectedBrand].splice(idx, 1);
        saveState();
        render();
      }
    }

    // เริ่มต้นรันแอปพลิเคชัน
    render();
  </script>
</body>
</html>
